---
layout: default
---

{{ content }}

<!-- <h2 class="fw-bold border-bottom pb-3 mb-5">Team</h2> -->
{% for item in site.data.settings.newsreel %}
<div class="row g-5 mb-5">

  <div class="col-md-2 my-auto">
    <center><h5 style="font-size:1.4em;">{{ item.date }}</h5>
  </div>

  <div class="col-md-5 my-auto">
    <center><h6 style="font-size:1.4em;">{{ item.description }}</h6></center>
   <center><a href="{{ item.link }}" style="font-size:1.4em;">{{ item.link_text }}</a></center>
  </div>

  <div class="col-md-5 my-auto">
    <img src="{{ site.github.url }}/{{ item.image }}" width="90%">
  </div>

</div>
<div class="row g-5 mb-5">
    <div class="col-md-3 my-auto">
    <img src="{{ site.github.url }}/assets/img/white_box.jpg" width="20%">
  </div>

</div>
{% endfor %}
